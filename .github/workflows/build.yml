name: Build Desktop Apps

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri NSIS installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles nsis

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: DailyDo-Windows-NSIS
          path: src-tauri/target/release/bundle/nsis/*.exe

  build-macos-intel:
    name: macOS Intel Build (Cross-compile)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app for Intel
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx tauri build --target x86_64-apple-darwin

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: DailyDo-macOS-Intel-DMG
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

      - name: Upload .app
        uses: actions/upload-artifact@v4
        with:
          name: DailyDo-macOS-Intel-App
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app

  build-macos-apple-silicon:
    name: macOS Apple Silicon Build (Cross-compile)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app for Apple Silicon
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx tauri build --target aarch64-apple-darwin

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: DailyDo-macOS-AppleSilicon-DMG
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

      - name: Upload .app
        uses: actions/upload-artifact@v4
        with:
          name: DailyDo-macOS-AppleSilicon-App
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
